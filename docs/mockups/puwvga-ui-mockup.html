<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>puwvga — UI Mockup (Lenovo Legion Toolkit Style)</title>
<style>
  :root {
    --font-sans: "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    --radius-window: 12px;
    --radius-card: 8px;
    --radius-control: 6px;
    --sidebar-w: 224px;
    --spring: cubic-bezier(0.22, 1, 0.36, 1);

    /* Dark Theme (Fluent / Lenovo Legion Toolkit) */
    --bg-desktop: #121214;
    --bg-window: #1c1c1e;
    --bg-sidebar: #18181a;
    --bg-card: #252528;
    --bg-card-hover: #2c2c30;
    --bg-control: #323236;
    --bg-control-hover: #3b3b40;
    --border-subtle: rgba(255, 255, 255, 0.075);
    --border-strong: rgba(255, 255, 255, 0.13);
    --text-primary: #f3f3f5;
    --text-secondary: #a1a1aa;
    --text-muted: #71717a;
    --accent: #4cc2ff;
    --accent-hover: #6ad0ff;
    --accent-fg: #0b141a;
    --accent-soft: rgba(76, 194, 255, 0.14);
    --nvidia: #76b900;
    --intel: #0071c5;
    --amd: #ed1c24;
    --ok: #34d399;
    --warn: #fbbf24;
    --shadow-window: 0 24px 64px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255,255,255,0.08);
  }

  [data-theme="light"] {
    --bg-desktop: #e5e7eb;
    --bg-window: #f3f3f3;
    --bg-sidebar: #ececef;
    --bg-card: #ffffff;
    --bg-card-hover: #fafafa;
    --bg-control: #f0f0f3;
    --bg-control-hover: #e5e5ea;
    --border-subtle: rgba(0, 0, 0, 0.075);
    --border-strong: rgba(0, 0, 0, 0.14);
    --text-primary: #18181b;
    --text-secondary: #52525b;
    --text-muted: #71717a;
    --accent: #0067c0;
    --accent-hover: #005aa8;
    --accent-fg: #ffffff;
    --accent-soft: rgba(0, 103, 192, 0.10);
    --shadow-window: 0 24px 60px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg-desktop);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 20px 28px;
    -webkit-font-smoothing: antialiased;
    transition: background 0.22s var(--spring), color 0.22s var(--spring);
  }

  /* Top Mockup Switcher Bar (Preview Harness Only) */
  .preview-bar {
    width: 100%;
    max-width: 1120px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    padding: 8px 14px;
    border-radius: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    font-size: 12px;
    color: var(--text-secondary);
    flex-wrap: wrap;
  }
  .preview-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .preview-label { font-weight: 600; color: var(--text-primary); margin-right: 4px; }
  .pill-btn {
    border: 1px solid var(--border-strong);
    background: var(--bg-control);
    color: var(--text-secondary);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s var(--spring), color 0.15s var(--spring), transform 0.1s ease-out, border-color 0.15s;
  }
  .pill-btn:hover { background: var(--bg-control-hover); color: var(--text-primary); }
  .pill-btn:active { transform: scale(0.97); }
  .pill-btn.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  /* Native Desktop Window Frame */
  .app-window {
    width: 100%;
    max-width: 1120px;
    height: 700px;
    background: var(--bg-window);
    border-radius: var(--radius-window);
    box-shadow: var(--shadow-window);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background 0.22s var(--spring);
  }

  /* Titlebar (Windows 11 Fluent) */
  .titlebar {
    height: 40px;
    background: var(--bg-sidebar);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px 0 16px;
    user-select: none;
    flex-shrink: 0;
  }
  .titlebar-left { display: flex; align-items: center; gap: 10px; }
  .app-mark {
    width: 18px; height: 18px; border-radius: 5px;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    display: grid; place-items: center; color: var(--accent);
  }
  .app-title { font-size: 13px; font-weight: 600; letter-spacing: 0.01em; }
  .app-sub { font-size: 11.5px; color: var(--text-muted); }
  .titlebar-right { display: flex; align-items: center; gap: 8px; }
  .badge-portable {
    font-size: 11px;
    color: var(--text-secondary);
    background: var(--bg-control);
    border: 1px solid var(--border-subtle);
    padding: 2px 8px;
    border-radius: 99px;
  }
  .win-controls { display: flex; gap: 2px; margin-left: 6px; }
  .win-btn {
    width: 34px; height: 28px; border: none; background: transparent;
    color: var(--text-secondary); border-radius: 5px; display: grid; place-items: center; cursor: pointer;
  }
  .win-btn:hover { background: var(--bg-control); color: var(--text-primary); }
  .win-btn.close:hover { background: #c42b1c; color: #fff; }

  /* Body: Sidebar + Main Content */
  .app-body {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  /* Sidebar (Lenovo Legion Toolkit) */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-subtle);
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .gpu-switcher {
    margin-bottom: 12px;
    padding: 8px;
    border-radius: var(--radius-card);
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
  }
  .gpu-switcher-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 6px;
    padding: 0 4px;
    display: flex;
    justify-content: space-between;
  }
  .gpu-chip-list { display: flex; flex-direction: column; gap: 4px; }
  .gpu-chip {
    width: 100%;
    text-align: left;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-secondary);
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s var(--spring), color 0.15s, border-color 0.15s, transform 0.1s;
  }
  .gpu-chip:hover { background: var(--bg-control); color: var(--text-primary); }
  .gpu-chip:active { transform: scale(0.98); }
  .gpu-chip.active {
    background: var(--bg-control);
    border-color: var(--border-strong);
    color: var(--text-primary);
  }
  .vendor-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .vendor-dot.nvidia { background: var(--nvidia); }
  .vendor-dot.intel { background: var(--intel); }
  .vendor-dot.amd { background: var(--amd); }
  .gpu-chip-info { min-width: 0; flex: 1; }
  .gpu-chip-name {
    font-size: 12px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gpu-chip-role { font-size: 10.5px; color: var(--text-muted); }

  .nav-list { display: flex; flex-direction: column; gap: 3px; }
  .nav-item {
    position: relative;
    width: 100%;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    padding: 9px 12px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    transition: background 0.14s var(--spring), color 0.14s, transform 0.1s;
  }
  .nav-item:hover { background: var(--bg-card); color: var(--text-primary); }
  .nav-item:active { transform: scale(0.985); }
  .nav-item.active {
    background: var(--bg-card);
    color: var(--text-primary);
    font-weight: 600;
  }
  .nav-item.active::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 8px;
    bottom: 8px;
    width: 3px;
    border-radius: 99px;
    background: var(--accent);
  }

  .sidebar-footer {
    border-top: 1px solid var(--border-subtle);
    padding-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  /* Main Scrollable Content */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 22px 26px 28px;
  }
  .page-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }
  .page-title { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; }
  .page-subtitle { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; }
  .header-actions { display: flex; align-items: center; gap: 8px; }

  .btn {
    border: 1px solid var(--border-strong);
    background: var(--bg-card);
    color: var(--text-primary);
    padding: 7px 12px;
    border-radius: var(--radius-control);
    font-size: 12.5px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s var(--spring), transform 0.1s;
  }
  .btn:hover { background: var(--bg-card-hover); }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-fg);
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent-hover); }

  /* Section & LLT Setting Cards */
  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 18px 0 8px;
  }
  .section-title:first-of-type { margin-top: 0; }

  .card-stack { display: flex; flex-direction: column; gap: 6px; }
  .setting-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-card);
    padding: 13px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition: background 0.15s var(--spring), border-color 0.15s;
  }
  .setting-card:hover { background: var(--bg-card-hover); border-color: var(--border-strong); }
  .card-left { display: flex; align-items: center; gap: 13px; min-width: 0; flex: 1; }
  .card-icon {
    width: 32px; height: 32px; border-radius: 7px;
    background: var(--bg-control);
    color: var(--text-primary);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .card-text { min-width: 0; }
  .card-label { font-size: 13.5px; font-weight: 500; color: var(--text-primary); }
  .card-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .card-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  /* GPU Telemetry Summary Grid */
  .gpu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }
  .gpu-panel {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 16px;
  }
  .gpu-panel-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .gpu-panel-title { display: flex; align-items: center; gap: 9px; font-size: 14.5px; font-weight: 600; }
  .gpu-panel-meta { font-size: 11.5px; color: var(--text-secondary); margin-top: 3px; }
  .tag {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 99px;
    background: var(--bg-control);
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .tag.live { color: var(--ok); background: rgba(52, 211, 153, 0.12); }

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .metric-box {
    background: var(--bg-window);
    border: 1px solid var(--border-subtle);
    border-radius: 7px;
    padding: 9px 10px;
  }
  .metric-k { font-size: 11px; color: var(--text-muted); }
  .metric-v {
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }

  /* Controls: Fluent Select, Slider, Toggle */
  select.fluent-select {
    background: var(--bg-control);
    color: var(--text-primary);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-control);
    padding: 6px 28px 6px 10px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    outline: none;
  }
  select.fluent-select:focus { border-color: var(--accent); }

  .slider-wrap { display: flex; align-items: center; gap: 10px; }
  input[type="range"].fluent-slider {
    width: 170px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .slider-val {
    min-width: 44px;
    text-align: right;
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
  }
  .reset-mini {
    border: none; background: transparent; color: var(--text-muted);
    cursor: pointer; padding: 4px; border-radius: 4px; display: grid; place-items: center;
  }
  .reset-mini:hover { background: var(--bg-control); color: var(--text-primary); }

  /* Spring Toggle Switch */
  .toggle {
    width: 40px; height: 22px; border-radius: 99px;
    background: var(--bg-control);
    border: 1px solid var(--border-strong);
    position: relative; cursor: pointer;
    transition: background 0.22s var(--spring), border-color 0.22s;
  }
  .toggle::after {
    content: "";
    position: absolute; top: 3px; left: 3px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--text-secondary);
    transition: transform 0.22s var(--spring), background 0.22s;
  }
  .toggle.on { background: var(--accent); border-color: var(--accent); }
  .toggle.on::after { transform: translateX(18px); background: var(--accent-fg); }

  /* Segmented Control (Global / Per-App, Display Selector) */
  .segmented {
    display: inline-flex;
    background: var(--bg-control);
    border: 1px solid var(--border-subtle);
    border-radius: 7px;
    padding: 3px;
    gap: 3px;
  }
  .seg-btn {
    border: none; background: transparent; color: var(--text-secondary);
    padding: 5px 12px; border-radius: 5px; font-size: 12.5px; font-weight: 500;
    font-family: inherit; cursor: pointer;
    transition: background 0.16s var(--spring), color 0.16s;
  }
  .seg-btn.active { background: var(--bg-card); color: var(--text-primary); font-weight: 600; }

  .display-strip {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .display-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    min-width: 210px;
    transition: border-color 0.15s, background 0.15s;
  }
  .display-card.active { border-color: var(--accent); background: var(--accent-soft); }
  .display-card-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .display-card-sub { font-size: 11.5px; color: var(--text-secondary); margin-top: 3px; font-variant-numeric: tabular-nums; }

  /* Multi-Display Spanning Preview & Auto-Revert Banner */
  .span-preview {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-card);
    padding: 14px 16px;
    margin-bottom: 6px;
  }
  .span-preview-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  .span-preview-title { font-size: 13px; font-weight: 600; }
  .span-res-pill {
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    padding: 3px 9px;
    border-radius: 99px;
    background: var(--bg-control);
    color: var(--text-primary);
    border: 1px solid var(--border-subtle);
  }
  .span-res-pill.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
  }
  .span-grid {
    display: grid;
    grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
    gap: 8px;
  }
  .span-tile {
    background: var(--bg-window);
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    padding: 11px 12px;
    min-height: 76px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: border-color 0.16s var(--spring), background 0.16s var(--spring);
  }
  .span-tile.active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .span-tile.empty {
    border-style: dashed;
    opacity: 0.55;
  }
  .span-tile-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .span-tile-idx {
    font-size: 11px; font-weight: 700;
    color: var(--text-primary);
    background: var(--bg-control);
    padding: 1px 6px; border-radius: 4px;
  }
  .span-tile-name {
    font-size: 12px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .span-tile-res { font-size: 11px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

  .revert-banner {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: var(--radius-card);
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .revert-text { font-size: 12.5px; color: var(--text-primary); }
  .revert-text strong { font-variant-numeric: tabular-nums; }
  .revert-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 28px;
    background: var(--bg-card);
    border: 1px solid var(--accent);
    color: var(--text-primary);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 0.2s var(--spring), transform 0.2s var(--spring);
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  svg.ic { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
</style>
</head>
<body>

<!-- Interactive Mockup Harness: test 1 GPU vs 2 GPU layouts, Theme, Language -->
<div class="preview-bar">
  <div class="preview-group">
    <span class="preview-label" data-i18n="simHardware">Mô phỏng phần cứng:</span>
    <button class="pill-btn active" onclick="setTopology('dual')">Laptop (Intel UHD + RTX 4060)</button>
    <button class="pill-btn" onclick="setTopology('nvidia')">PC (1 VGA: NVIDIA RTX 4060)</button>
    <button class="pill-btn" onclick="setTopology('amd')">PC (1 VGA: AMD Radeon RX 7800 XT)</button>
    <button class="pill-btn" onclick="setTopology('intel')">PC (1 VGA: Intel Arc / UHD)</button>
  </div>
  <div class="preview-group">
    <button class="pill-btn" id="btnLang" onclick="toggleLang()">VI / EN</button>
    <button class="pill-btn" id="btnTheme" onclick="toggleTheme()">Dark / Light</button>
  </div>
</div>

<!-- Native App Window -->
<div class="app-window">
  <div class="titlebar">
    <div class="titlebar-left">
      <div class="app-mark">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 10h8M8 14h5"/></svg>
      </div>
      <span class="app-title">puwvga</span>
      <span class="app-sub" data-i18n="appSub">Điều khiển VGA thuần Rust · Không chạy nền</span>
    </div>
    <div class="titlebar-right">
      <span class="badge-portable">Portable · Static VC++</span>
      <div class="win-controls">
        <button class="win-btn" title="Minimize"><svg class="ic" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <button class="win-btn" title="Maximize"><svg class="ic" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
        <button class="win-btn close" title="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
      </div>
    </div>
  </div>

  <div class="app-body">
    <aside class="sidebar">
      <div>
        <div class="gpu-switcher">
          <div class="gpu-switcher-label">
            <span data-i18n="detectedGpus">VGA phát hiện</span>
            <span id="gpuCountLabel">2</span>
          </div>
          <div class="gpu-chip-list" id="gpuChipList"></div>
        </div>

<script>
const I18N = {

    settingsSub: "Giao diện, ngôn ngữ song ngữ Anh/Việt và Preset JSON portable",
    vram: "VRAM", driverVer: "Driver", apiLabel: "Driver API", attachedDisplays: "Màn hình kết nối",
    applied: "Đã áp dụng trực tiếp vào driver",
    globalTab: "Toàn hệ thống (Global)",
    perAppTab: "Theo ứng dụng (Per-App)"
  },
  en: {
    simHardware: "Hardware Simulation:",
    appSub: "Pure Rust GPU Control · Zero Background Overhead",
    detectedGpus: "Detected GPUs",
    navDashboard: "Dashboard",
    navColor: "Color & Brightness",
    navDisplay: "Display & MUX",
    navGraphics: "3D & Video",
    navSettings: "Settings",
    dashTitle: "Hardware Overview",
    dashSub: "Static GPU & driver info only · Zero telemetry, zero background polling",

    displayTitle: "Display & Output Mode",

    vram: "VRAM", driverVer: "Driver", apiLabel: "Driver API", attachedDisplays: "Connected Displays",
    applied: "Applied directly to GPU driver",
    globalTab: "Global Settings",
    perAppTab: "Per-App Profiles"
  }
};

const TOPOLOGIES = {
  dual: [
    { id: "intel0", vendor: "intel", role: "iGPU · Display 1", name: "Intel(R) UHD Graphics", driver: "32.0.101.6881", api: "ControlLib.dll (IGCL)", vram: "Shared (DXGI)", pciId: "VEN_8086 · DEV_A78B", displays: ["Màn hình Laptop (2560×1600 @ 165Hz)"] },
    { id: "nv0", vendor: "nvidia", role: "dGPU · HDMI / USB-C", name: "NVIDIA GeForce RTX 4060 Laptop", driver: "32.0.16.1692", api: "nvapi64.dll + DRS", vram: "8.0 GB GDDR6", pciId: "VEN_10DE · DEV_28E0", displays: ["DELL U2723QE · HDMI (2560×1440 @ 144Hz)", "LG UltraGear · USB-C (2560×1440 @ 144Hz)"] }
  ],
  nvidia: [
    { id: "nv0", vendor: "nvidia", role: "Primary GPU", name: "NVIDIA GeForce RTX 4060", driver: "32.0.16.1692", api: "nvapi64.dll + DRS", vram: "8.0 GB GDDR6", pciId: "VEN_10DE · DEV_2882", displays: ["LG UltraGear 27GP850 (2560×1440 @ 165Hz)", "ASUS TUF VG27AQ (2560×1440 @ 165Hz)"] }
  ],
  amd: [
    { id: "amd0", vendor: "amd", role: "Primary GPU", name: "AMD Radeon RX 7800 XT", driver: "25.4.1", api: "atiadlxx.dll (ADLX)", vram: "16.0 GB GDDR6", pciId: "VEN_1002 · DEV_747E", displays: ["ASUS ROG XG27AQ (2560×1440 @ 170Hz)", "MSI Optix MAG274QRF (2560×1440 @ 170Hz)"] }
  ],
  intel: [
    { id: "intel0", vendor: "intel", role: "Primary GPU", name: "Intel(R) Arc A770 Graphics", driver: "32.0.101.6881", api: "ControlLib.dll (IGCL)", vram: "16.0 GB GDDR6", pciId: "VEN_8086 · DEV_56A0", displays: ["Dell P2723D · DP1 (2560×1440 @ 60Hz)", "Dell P2723D · DP2 (2560×1440 @ 60Hz)"] }
  ]
};

let state = {
  topology: "dual",
  selectedGpuId: "intel0",
  page: "dashboard",
  lang: "vi",
  theme: "dark",
  gfxScope: "global",
  nvShowLegacy: true,
  spanCountdown: 15,
  values: {
    brightness: 50, contrast: 50, gamma: 1.0, vibrance: 55, hue: 0, sharpness: 25,
    colorTemp: 6500, lace: true, vrr: true,
    spanEnabled: false, spanLayout: "1x2", spanBezelX: 0, spanBezelY: 0, spanPendingConfirm: false,
    nvDlssPreset: "Use 3D app setting", nvDlssFg: "Use 3D app setting", nvDlssSr: "Use 3D app setting",
    nvSmoothMotion: false, nvLowLatency: "Ultra", nvAutoDispSwitch: false, nvBatteryBoost: true,
    nvCudaFallback: "Driver Default", nvDsrFactors: "Off", nvGpuAssign: "NVIDIA GeForce RTX 4060 Laptop GPU",
    nvImageScaling: "Off", nvMaxFps: "Off", nvOpenglGdi: "Auto", nvPower: "Prefer Maximum Performance",
    nvRtxDynVibrance: false, nvRtxHdrGame: false, nvShaderCache: "Driver Default",
    nvVsync: "Use 3D app setting", nvVrVrss: "Off", nvVkPresent: "Auto",
    nvAf: "Application-controlled", nvFxaa: false, nvAaTrans: "Off", nvBgMaxFps: "Off",
    nvMfaa: false, nvPhysx: "Auto", nvTexAnisoOpt: false, nvTexLodBias: "Allow",
    nvTexQuality: "Quality", nvTexTrilinear: true, nvThreaded: "Auto",
    nvRtxVsr: "Auto", nvRtxHdr: false, nvVideoRange: "Full (0-255)",
    intelFlipMode: "Application Default", intelLowLatency: "On", intelFrameLimit: "Off",
    intelAf: "Application Choice", intelCmaa: "Application", intelTess: "Auto",
    intelSharpness: 20, intelEndurance: "Auto", intelVsr: true, intelFilmMode: true,
    intelDenoise: 30, intelVideoSharpen: 25,
    amdAntiLag: true, amdChill: false, amdBoost: false, amdRis: 50,
    amdEnhancedSync: false, amdVsync: "Off, unless app specifies", amdFrtc: "Off",
    amdTexQuality: "Standard", amdSurfaceOpt: true, amdTess: "AMD Optimized",
    amdVideoProfile: "Default", amdVideoUpscale: true, amdVideoSharpen: 30
  }
};

function t(k) { return I18N[state.lang][k] || k; }
function activeGpus() { return TOPOLOGIES[state.topology]; }
function activeGpu() { return activeGpus().find(g => g.id === state.selectedGpuId) || activeGpus()[0]; }

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window._t);
  window._t = setTimeout(() => el.classList.remove("show"), 1800);
}

function setTopology(topo) {
  stopSpanTimer();
  state.topology = topo;
  state.selectedGpuId = TOPOLOGIES[topo][0].id;
  state.values.spanEnabled = false;
  state.values.spanPendingConfirm = false;
  document.querySelectorAll(".preview-bar .preview-group:first-child .pill-btn").forEach((b, i) => {
    const keys = ["dual", "nvidia", "amd", "intel"];
    b.classList.toggle("active", keys[i] === topo);
  });
  renderAll();
}

function selectGpu(id) {
  stopSpanTimer();
  state.selectedGpuId = id;
  state.values.spanEnabled = false;
  state.values.spanPendingConfirm = false;
  renderAll();
}

function stopSpanTimer() {
  if (window._spanTimer) {
    clearInterval(window._spanTimer);
    window._spanTimer = null;
  }
}

function enableSpanning() {
  stopSpanTimer();
  state.values.spanEnabled = true;
  state.values.spanPendingConfirm = true;
  state.spanCountdown = 15;
  renderMain();
  if (typeof setInterval === "function") {
    window._spanTimer = setInterval(() => {
      state.spanCountdown -= 1;
      if (state.spanCountdown <= 0) {
        revertSpanning(true);
      } else {
        const el = document.getElementById("spanCountdownNum");
        if (el) el.textContent = state.spanCountdown + "s";
      }
    }, 1000);
  }
}

function keepSpanning() {
  stopSpanTimer();
  state.values.spanPendingConfirm = false;
  renderMain();
  showToast(state.lang === "vi" ? "Đã giữ cấu hình ghép màn hình" : "Spanning configuration kept");
}

function revertSpanning(auto) {
  stopSpanTimer();
  state.values.spanEnabled = false;
  state.values.spanPendingConfirm = false;
  renderMain();
  showToast(auto
    ? (state.lang === "vi" ? "Hết 15s chưa xác nhận — đã tự hoàn tác màn hình" : "15s expired — automatically reverted display topology")
    : (state.lang === "vi" ? "Đã tách màn hình về chế độ độc lập" : "Spanning disabled"));
}

function setPage(p) {
  state.page = p;
  document.querySelectorAll(".nav-item").forEach(el => el.classList.toggle("active", el.dataset.page === p));
  renderMain();
}

function toggleLang() {
  state.lang = state.lang === "vi" ? "en" : "vi";
  renderAll();
}

function toggleTheme() {
  state.theme = state.theme === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", state.theme);
  renderMain();
}

function renderSidebarGpus() {
  const gpus = activeGpus();
  document.getElementById("gpuCountLabel").textContent = gpus.length;
  const list = document.getElementById("gpuChipList");
  list.innerHTML = gpus.map(g => `
    <button class="gpu-chip ${g.id === activeGpu().id ? "active" : ""}" onclick="selectGpu('${g.id}')">
      <span class="vendor-dot ${g.vendor}"></span>
      <div class="gpu-chip-info">
        <div class="gpu-chip-name">${g.name}</div>
        <div class="gpu-chip-role">${g.role}</div>
      </div>
    </button>
  `).join("");
}

function sliderCard(label, desc, key, min, max, step, unit, rerenderOnChange) {
  const val = state.values[key];
  const onChangeAttr = rerenderOnChange
    ? `onchange="state.values['${key}']=Number(this.value); renderMain(); showToast('${label}: ' + this.value + '${unit} · ' + t('applied'))"`
    : `onchange="showToast('${label}: ' + this.value + '${unit} · ' + t('applied'))"`;
  return `
    <div class="setting-card">
      <div class="card-left">
        <div class="card-icon"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></div>
        <div class="card-text">
          <div class="card-label">${label}</div>
          <div class="card-desc">${desc}</div>
        </div>
      </div>
      <div class="card-right">
        <div class="slider-wrap">
          <input type="range" class="fluent-slider" min="${min}" max="${max}" step="${step}" value="${val}"
            oninput="state.values['${key}']=Number(this.value); this.nextElementSibling.textContent=this.value+'${unit}'"
            ${onChangeAttr}/>
          <span class="slider-val">${val}${unit}</span>
          <button class="reset-mini" title="Reset" onclick="showToast('Reset ${label}')">
            <svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>
      </div>
    </div>`;
}

function toggleCard(label, desc, key) {
  const on = !!state.values[key];
  return `
    <div class="setting-card">
      <div class="card-left">
        <div class="card-icon"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2v10M18.4 6.6a9 9 0 1 1-12.77.04"/></svg></div>
        <div class="card-text">
          <div class="card-label">${label}</div>
          <div class="card-desc">${desc}</div>
        </div>
      </div>
      <div class="card-right">
        <button class="toggle ${on ? "on" : ""}" onclick="state.values['${key}']=!state.values['${key}']; renderMain(); showToast('${label} · ' + t('applied'))"></button>
      </div>
    </div>`;
}

function selectCard(label, desc, options, selected, key, rerenderOnChange) {
  const current = key && state.values[key] !== undefined ? state.values[key] : selected;
  const rerenderPart = rerenderOnChange ? "renderMain(); " : "";
  const onChange = key
    ? `state.values['${key}']=this.value; ${rerenderPart}showToast('${label}: ' + this.value + ' · ' + t('applied'))`
    : `showToast('${label}: ' + this.value + ' · ' + t('applied'))`;
  return `
    <div class="setting-card">
      <div class="card-left">
        <div class="card-icon"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></div>
        <div class="card-text">
          <div class="card-label">${label}</div>
          <div class="card-desc">${desc}</div>
        </div>
      </div>
      <div class="card-right">
        <select class="fluent-select" onchange="${onChange}">
          ${options.map(o => `<option ${o === current ? "selected" : ""}>${o}</option>`).join("")}
        </select>
      </div>
    </div>`;
}

function renderMain() {
  const main = document.getElementById("mainContent");
  const gpus = activeGpus();
  const gpu = activeGpu();
  const isVi = state.lang === "vi";

  if (state.page === "dashboard") {
    main.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">${t("dashTitle")}</div>
          <div class="page-subtitle">${t("dashSub")}</div>
        </div>
        <div class="header-actions">
          <button class="btn" onclick="showToast(t('refresh'))">${t("refresh")}</button>
        </div>
      </div>

      <div class="gpu-grid">
        ${gpus.map(g => `
          <div class="gpu-panel">
            <div class="gpu-panel-head">
              <div>
                <div class="gpu-panel-title"><span class="vendor-dot ${g.vendor}"></span>${g.name}</div>
                <div class="gpu-panel-meta">Driver ${g.driver} · ${g.api}</div>
              </div>
              <span class="tag live">Active</span>
            </div>
            <div class="metrics-grid" style="grid-template-columns:repeat(2,1fr)">
              <div class="metric-box"><div class="metric-k">${t("driverVer")}</div><div class="metric-v" style="font-size:13.5px">${g.driver}</div></div>
              <div class="metric-box"><div class="metric-k">${t("vram")}</div><div class="metric-v" style="font-size:13.5px">${g.vram}</div></div>
              <div class="metric-box"><div class="metric-k">PCI ID</div><div class="metric-v" style="font-size:13px">${g.pciId}</div></div>
              <div class="metric-box"><div class="metric-k">${t("attachedDisplays")}</div><div class="metric-v" style="font-size:13.5px">${g.displays.length}</div></div>
            </div>
          </div>
        `).join("")}
      </div>

      <div class="section-title">${isVi ? "Trạng thái nhanh" : "Quick Status"}</div>
      <div class="card-stack">
        ${gpus.length > 1
          ? selectCard("Display Mode (MUX / Optimus)", isVi ? "Chuyển chế độ xuất hình giữa iGPU tiết kiệm điện và dGPU trực tiếp" : "Switch display output between hybrid Optimus and dGPU-only", ["Automatic Select (Advanced Optimus)", "Optimus (iGPU + dGPU)", "NVIDIA GPU Only"], "Optimus (iGPU + dGPU)")
          : `<div class="setting-card"><div class="card-left"><div class="card-icon"><svg class="ic" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div><div class="card-text"><div class="card-label">${isVi ? "Chế độ đơn GPU (PC)" : "Single GPU Mode (Desktop)"}</div><div class="card-desc">${gpu.name} · ${gpu.displays[0]}</div></div></div><span class="tag">Direct Output</span></div>`}
      </div>
    `;
    return;
  }

  if (state.page === "color") {
    const isIntel = gpu.vendor === "intel";
    const isNvidia = gpu.vendor === "nvidia";
    const isAmd = gpu.vendor === "amd";
    main.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">${t("colorTitle")}</div>
          <div class="page-subtitle">${t("colorSub")}</div>
        </div>
        <div class="header-actions">
          <button class="btn" onclick="showToast(t('resetAll'))">${t("resetAll")}</button>
        </div>
      </div>

      <div class="display-strip">
        ${gpus.map(g => `
          <div class="display-card ${g.id === gpu.id ? "active" : ""}" onclick="selectGpu('${g.id}')">
            <div class="display-card-name"><span class="vendor-dot ${g.vendor}"></span>${g.displays[0].split(" (")[0]}</div>
            <div class="display-card-sub">${g.name} · ${g.displays[0].match(/\((.*)\)/)[1]}</div>
          </div>
        `).join("")}
      </div>

      <div class="section-title">${isVi ? "Điều chỉnh hình ảnh" : "Color Adjustments"} · ${gpu.name}</div>
      <div class="card-stack">
        ${sliderCard("Brightness", isVi ? "Độ sáng hiển thị đầu ra của driver" : "Driver output brightness", "brightness", 0, 100, 1, "%")}
        ${sliderCard("Contrast", isVi ? "Độ tương phản giữa vùng sáng và vùng tối" : "Contrast ratio adjustment", "contrast", 0, 100, 1, "%")}
        ${sliderCard("Gamma", isVi ? "Đường cong sáng trung gian (mặc định 1.00)" : "Mid-tone gamma curve (default 1.00)", "gamma", 0.5, 2.5, 0.05, "")}
        ${sliderCard(isNvidia ? "Digital Vibrance" : "Saturation", isVi ? "Độ rực màu sắc hiển thị" : "Color saturation / vibrance intensity", "vibrance", 0, 100, 1, "%")}
        ${sliderCard("Hue", isVi ? "Dịch chuyển tông màu (-180° đến +180°)" : "Color hue angle", "hue", -180, 180, 1, "°")}
        ${isIntel ? toggleCard("Dynamic Contrast Enhancement (LACE)", isVi ? "Tự cân bằng tương phản cục bộ trên Intel iGPU" : "Intel Local Adaptive Contrast Enhancement", "lace") : ""}
        ${isAmd ? sliderCard("Color Temperature", isVi ? "Nhiệt độ màu (Kelvin) trên AMD ADLX" : "Display color temperature (Kelvin)", "colorTemp", 4000, 10000, 100, "K") : ""}
      </div>

      <div class="section-title">${isVi ? "Định dạng tín hiệu màu (Wire Format)" : "Output Color Format"}</div>
      <div class="card-stack">
        ${selectCard("Output Color Depth", isVi ? "Độ sâu màu mỗi kênh (bpc)" : "Bits per color channel", ["8 bpc", "10 bpc", "12 bpc"], "10 bpc")}
        ${selectCard("Output Color Format", isVi ? "Không gian màu xuất ra màn hình" : "Pixel format sent to display", ["RGB", "YCbCr444", "YCbCr422", "YCbCr420"], "RGB")}
        ${selectCard("Output Dynamic Range", isVi ? "Dải động Full (0–255) cho màn hình PC, Limited (16–235) cho TV" : "Full (0-255) for monitors, Limited (16-235) for TVs", ["Full (0-255)", "Limited (16-235)"], "Full (0-255)")}
      </div>
    `;
    return;
  }

  if (state.page === "display") {

          ${selectCard("Endurance Gaming", isVi ? "Tự cân bằng FPS và điện năng để kéo dài pin laptop" : "Intel battery-saving frame pacing mode", ["Off", "Auto", "Better Performance", "Balanced", "Maximum Battery"], "Auto", "intelEndurance")}
        </div>

        <div class="section-title">Intel Video Processing (IGCL · ctlGetSetVideoProcessingFeature)</div>
        <div class="card-stack">
          ${toggleCard("Intel Video Super Resolution", isVi ? "Tăng độ phân giải và độ nét video qua Media Engine" : "Hardware video upscaling via Intel Media Engine", "intelVsr")}
          ${toggleCard("Film Mode Detection", isVi ? "Phát hiện nguồn phim 24fps / khử răng cưa telecine" : "Detect film cadence for smoother video playback", "intelFilmMode")}
          ${sliderCard("Video Denoise", isVi ? "Khử nhiễu hạt trên video phát bằng phần cứng" : "Hardware temporal/spatial video noise reduction", "intelDenoise", 0, 100, 1, "%")}
          ${sliderCard("Adaptive Video Sharpening", isVi ? "Làm nét chi tiết video theo vùng ảnh" : "Content-adaptive video sharpening", "intelVideoSharpen", 0, 100, 1, "%")}
        </div>`;
    } else if (isAmd) {
      vendorBody = `
        <div class="section-title">AMD 3D Gaming (ADLX)</div>
        <div class="card-stack">
          ${toggleCard("Radeon Anti-Lag", isVi ? "Đồng bộ nhịp CPU với GPU để giảm độ trễ đầu vào" : "Pace CPU work to minimize input-to-display latency", "amdAntiLag")}
          ${toggleCard("Radeon Chill", isVi ? "Tự điều chỉnh FPS theo chuyển động chuột/phím để mát GPU" : "Dynamic framerate scaling based on input activity", "amdChill")}
          ${toggleCard("Radeon Boost", isVi ? "Hạ nhẹ độ phân giải khi quay camera nhanh để giữ FPS cao" : "Dynamic resolution scaling during fast camera motion", "amdBoost")}
          ${sliderCard("Radeon Image Sharpening (RIS)", isVi ? "Làm nét hình ảnh tương phản thích ứng ít tốn hiệu năng" : "Contrast-adaptive sharpening for 3D rendering", "amdRis", 0, 100, 10, "%")}
          ${toggleCard("Radeon Enhanced Sync", isVi ? "Giảm xé hình ở FPS cao mà ít trễ hơn VSync thường" : "Low-latency tearing reduction above/below refresh rate", "amdEnhancedSync")}
          ${selectCard("Wait for Vertical Refresh", isVi ? "Chính sách đồng bộ khung hình VSync của AMD" : "AMD vertical refresh synchronization policy", ["Always Off", "Off, unless app specifies", "On, unless app specifies", "Always On"], "Off, unless app specifies", "amdVsync")}
          ${selectCard("Frame Rate Target Control (FRTC)", isVi ? "Giới hạn FPS trần toàn cục trên Radeon" : "Global maximum frame rate cap", ["Off", "60 FPS", "120 FPS", "144 FPS", "165 FPS"], "Off", "amdFrtc")}
          ${selectCard("Texture Filtering Quality", isVi ? "Cân bằng chất lượng và tốc độ lọc texture" : "Texture filtering quality preset", ["High", "Standard", "Performance"], "Standard", "amdTexQuality")}
          ${toggleCard("Surface Format Optimization", isVi ? "Tối ưu định dạng bề mặt render giúp nhẹ VRAM" : "Optimize render surface formats for memory bandwidth", "amdSurfaceOpt")}
          ${selectCard("Tessellation Mode", isVi ? "Cách driver AMD xử lý hệ số tessellation" : "Driver control over tessellation level", ["AMD Optimized", "Use application settings", "Override application settings"], "AMD Optimized", "amdTess")}
        </div>

        <div class="section-title">AMD Video (ADLX)</div>
        <div class="card-stack">
          ${selectCard("Video Profile", isVi ? "Cấu hình hiển thị màu và tương phản cho video Radeon" : "AMD Radeon hardware video color profile", ["Default", "Cinema Classic", "Enhanced", "Vivid", "Custom"], "Default", "amdVideoProfile")}
          ${toggleCard("AMD Video Upscale", isVi ? "Nâng cấp độ nét video độ phân giải thấp qua ADLX" : "Hardware video upscaling filter", "amdVideoUpscale")}
          ${sliderCard("Video Sharpening", isVi ? "Mức độ làm nét video phát lại" : "Video playback sharpening intensity", "amdVideoSharpen", 0, 100, 1, "%")}
        </div>`;
    }

    main.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">${t("gfxTitle")}</div>
          <div class="page-subtitle">${t("gfxSub")}</div>
        </div>
        ${scopeControl}
      </div>
      ${gpuStrip}
      ${perAppBox}
      ${vendorBody}
    `;
    return;
  }

  if (state.page === "settings") {
    main.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">${t("settingsTitle")}</div>
          <div class="page-subtitle">${t("settingsSub")}</div>
        </div>
      </div>

      <div class="section-title">${isVi ? "Giao diện & Ngôn ngữ" : "Appearance & Language"}</div>
      <div class="card-stack">
        <div class="setting-card">
          <div class="card-left">
            <div class="card-icon"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></div>
            <div class="card-text">
              <div class="card-label">${isVi ? "Chủ đề giao diện (Theme)" : "Appearance Theme"}</div>
              <div class="card-desc">${isVi ? "Tối / Sáng đồng bộ phong cách Windows 11 Fluent" : "Dark / Light Windows 11 Fluent palette"}</div>
            </div>
          </div>
          <div class="card-right">
            <div class="segmented">
              <button class="seg-btn ${state.theme === "dark" ? "active" : ""}" onclick="if(state.theme!=='dark')toggleTheme()">Dark</button>
              <button class="seg-btn ${state.theme === "light" ? "active" : ""}" onclick="if(state.theme!=='light')toggleTheme()">Light</button>
            </div>
          </div>
        </div>

        <div class="setting-card">
          <div class="card-left">
            <div class="card-icon"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></div>
            <div class="card-text">
              <div class="card-label">${isVi ? "Ngôn ngữ / Language" : "Language / Ngôn ngữ"}</div>
              <div class="card-desc">${isVi ? "Chuyển đổi tức thì giữa Tiếng Việt và English" : "Instant switch between Vietnamese and English"}</div>
            </div>
          </div>
          <div class="card-right">
            <div class="segmented">
              <button class="seg-btn ${state.lang === "vi" ? "active" : ""}" onclick="if(state.lang!=='vi')toggleLang()">Tiếng Việt</button>
              <button class="seg-btn ${state.lang === "en" ? "active" : ""}" onclick="if(state.lang!=='en')toggleLang()">English</button>
            </div>
          </div>
        </div>
      </div>

      <div class="section-title">${isVi ? "Preset cục bộ (Portable JSON)" : "Local Presets (Portable JSON)"}</div>
      <div class="card-stack">
        <div class="setting-card">
          <div class="card-left">
            <div class="card-icon"><svg class="ic" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></div>
            <div class="card-text">
              <div class="card-label">${isVi ? "Lưu / Áp dụng Preset" : "Save / Apply Preset"}</div>
              <div class="card-desc">puwvga.presets.json (cạnh file .exe · 0% chạy ngầm)</div>
            </div>
          </div>
          <div class="card-right">
            <button class="btn" onclick="showToast('Saved puwvga.presets.json')">${isVi ? "Lưu Preset" : "Save"}</button>
            <button class="btn btn-primary" onclick="showToast('Applied preset')">${isVi ? "Áp dụng" : "Apply"}</button>
          </div>
        </div>
      </div>
    `;
  }
}

function renderAll() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  renderSidebarGpus();
  renderMain();
}

renderAll();
</script>
</body>
</html>
